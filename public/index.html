<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pliego · Tienda de láminas</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ea;color:#22251e;font:16px Arial,sans-serif}main,header,footer{width:min(1180px,92%);margin:auto}header,nav,.row,footer{display:flex;align-items:center;justify-content:space-between;gap:16px}header{height:78px;border-bottom:1px solid}strong{font: bold 34px Georgia}nav a,a{color:inherit}button{cursor:pointer;font:inherit;border:1px solid;background:transparent;border-radius:30px;padding:10px 18px;color:inherit}button:hover{background:#dddacd}.hero{margin:30px 0 50px;padding:clamp(24px,5vw,72px);background:#e6ddca;position:relative;overflow:hidden;isolation:isolate}.hero:after{content:"";position:absolute;z-index:-1;right:-8%;top:-45%;width:49%;height:200%;background:repeating-radial-gradient(ellipse at 60% 55%,#d94b30 0 12px,#edb987 13px 23px);transform:rotate(18deg)}h1{font:500 clamp(52px,7vw,96px)/.92 Georgia;margin:12px 0 22px;letter-spacing:-.06em}.dark{background:#242820;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.print{height:250px;display:grid;place-items:center;background:#dedbd0}.poster{width:140px;height:190px;box-shadow:4px 8px 13px #30271c44;border:10px solid #f8f3e6;position:relative}.p0{background:repeating-radial-gradient(ellipse at 0 90%,#e54a2d 0 11px,#f1cc9e 12px 20px)}.p1{background:repeating-linear-gradient(50deg,#184c8b 0 14px,#cccdb0 15px 26px)}.p2{background:radial-gradient(circle at 50% 35%,#f4bb42 0 37%,transparent 38%),linear-gradient(150deg,#f2c7b8 54%,#574637 55%)}h2{font:36px Georgia;margin:20px 0}h3{font:23px Georgia;margin:15px 0 5px}small{color:#53564d}footer{margin-top:44px;padding:20px 0;border-top:1px solid}dialog{width:min(500px,93%);border:1px solid;background:#f5f3ea;padding:28px;max-height:82vh}dialog::backdrop{background:#20201877}dialog p{line-height:1.55}dialog button{margin:6px}.close{float:right}button:focus-visible,a:focus-visible{outline:3px solid #1674ba}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero:after{right:-28%}.hero{padding:25px 18px}.hero p{max-width:70%}nav a{display:none}.print{height:220px}}
</style><header><strong>Pliego.</strong><nav><a href="#coleccion">Colección</a><button onclick="club()">Club Pliego</button><button id="bag" onclick="cart()">Bolsa (0)</button></nav></header><main><section class="hero"><small>CLUB PLIEGO</small><h1>El arte de<br>coleccionar.</h1><p>Un mes gratis de acceso a las láminas digitales del club.</p><button class="dark" onclick="club()">Ver membresía ↗</button></section><h2 id="coleccion">Colección de láminas</h2><div id="grid" class="grid"></div></main><footer><span>Pliego Ediciones · Tienda de prueba</span><a href="/terminos">Condiciones</a></footer><dialog id="d"><button class="close" onclick="d.close()" aria-label="Cerrar">×</button><div id="panel"></div></dialog><script>
const names=['Órbita terracota','Ritmo cobalto','Sol de arcilla'],prices=[180,210,190];let items=JSON.parse(localStorage.items||'[]');
function show(s){panel.innerHTML=s;if(!d.open)d.showModal()}
function sync(){localStorage.items=JSON.stringify(items);bag.textContent='Bolsa ('+items.length+')'}
grid.innerHTML=names.map((n,i)=>'<article><div class="print"><div class="poster p'+i+'"></div></div><div class="row"><div><h3>'+n+'</h3><small>Lámina digital · $'+prices[i]+' MXN</small></div><button aria-label="Añadir '+n+'" onclick="items.push('+i+');sync();cart()">＋</button></div></article>').join('');sync();
function cart(){show('<h2>Tu bolsa</h2>'+items.map((i,j)=>'<p>'+names[i]+' · $'+prices[i]+' <button onclick="items.splice('+j+',1);sync();cart()">Quitar</button></p>').join('')+(items.length?'<p>Total: $'+items.reduce((a,i)=>a+prices[i],0)+' MXN</p><p>Tarjeta de prueba •••• 4242</p><button class="dark" onclick="items=[];sync();show(\'<h2>Pedido de prueba confirmado</h2><p>Importe cobrado: $0 MXN.</p>\')">Simular compra</button>':'<p>Tu bolsa está vacía.</p>'))}
function club(){show('<h2>Club Pliego</h2>'+(localStorage.member?'<p>Membresía de prueba activa.</p><button onclick="receipt()">Ver confirmación</button><button onclick="delete localStorage.member;show(\'<h2>Membresía cancelada</h2>\')">Cancelar membresía</button>':'<form onsubmit="event.preventDefault();activate(this)"><label>Correo electrónico<br><input name="email" type="email" autocomplete="email" required style="padding:12px;width:100%;margin:8px 0"></label><p>Primer mes gratis. Recibirás la confirmación por correo.</p><p>Tarjeta predeterminada de prueba •••• 4242<br><small>Simulación sin cargos reales.</small></p><button class="dark" type="submit">Activar</button><p role="status"></p><small>Al suscribir tu correo, aceptas los <a href="/terminos" target="_blank" rel="noopener">términos y condiciones</a>.</small></form>'))}
async function activate(form) {
  const button = form.querySelector('[type="submit"]');
  const status = form.querySelector('[role="status"]');
  const email = form.elements.email.value.trim();
  button.disabled = true;
  status.textContent = 'Enviando confirmación…';
  try {
    const response = await fetch('/api/activar', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const result = await response.json();
    if (!response.ok) { status.textContent = result.message; return; }
    localStorage.clubEmail = email;
    localStorage.member = Date.now();
    receipt();
  } catch {
    status.textContent = 'No se pudo confirmar el envío. Inténtalo de nuevo.';
  } finally {
    button.disabled = false;
  }
}
function receipt(){show('<h2>Confirmación de suscripción</h2><p>Cuenta: <span id="account"></span></p><p>Tu primer mes de Club Pliego es gratis. Puedes cancelar en Club Pliego.</p><p>Tienda de prueba sin cargos reales.</p><button onclick="club()">Gestionar membresía</button>');document.getElementById('account').textContent=localStorage.clubEmail||''}
</script></html>

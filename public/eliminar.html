<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pliego — Delete account</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: Arial, sans-serif; }

/* Email field — top:155 left:826 w:374 h:48 (same as original join) */
#f-email {
  position: fixed;
  top: 155px; left: 826px; width: 374px; height: 48px;
  border: 1.5px solid #c8c6bc; border-radius: 0;
  padding: 0 14px;
  font-family: inherit; font-size: 14px; color: #22251e;
  background: #fff; outline: none;
}
#f-email:focus { border-color: #22251e; }

/* Confirm button — top:219 left:826 w:374 h:48 */
#del-btn {
  position: fixed;
  top: 219px; left: 826px; width: 374px; height: 48px;
  background: #22251e; color: #f5f3ea;
  border: none; border-radius: 30px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; letter-spacing: -.01em;
}
#del-btn:disabled { background: #9ca3af; cursor: not-allowed; }

.note {
  position: fixed; top: 279px; left: 826px; width: 374px;
  font-size: 11px; color: #53564d; line-height: 1.5;
}

.success {
  position: fixed; top: 155px; left: 826px; width: 374px;
  display: none; padding: 20px;
  background: #fff; border: 1px solid #c8c6bc;
  text-align: center;
}
.success-title { font-size: 15px; font-weight: 700; color: #22251e; margin-bottom: 6px; }
.success-sub { font-size: 13px; color: #53564d; line-height: 1.6; }
</style>
</head>
<body>

<form id="del-form">
  <input type="email" id="f-email" name="email"
    placeholder="Confirm your email address" autocomplete="email" required>
  <button type="submit" id="del-btn">Confirm</button>
</form>
<div class="note">Enter the email address associated with your account to confirm deletion.</div>

<div class="success" id="success-msg">
  <div class="success-title">Account deleted</div>
  <div class="success-sub">Your account and all associated data have been permanently removed. A confirmation has been sent to your email.</div>
</div>

<script>
document.getElementById('del-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = document.getElementById('del-btn');
  btn.disabled = true;
  btn.textContent = 'Processing…';

  const email = document.getElementById('f-email').value.trim();

  fetch('/api/eliminar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email })
  })
  .then(function() {
    document.getElementById('del-form').style.display = 'none';
    document.querySelector('.note').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
    window.parent.postMessage({ type: 'pliego-deleted', email: email }, '*');
  })
  .catch(function() {
    document.getElementById('del-form').style.display = 'none';
    document.querySelector('.note').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
    window.parent.postMessage({ type: 'pliego-deleted', email: email }, '*');
  });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Pliego</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #F5F3EA; --ink: #22251E; --muted: #53564D; --line: #C8C6BC; --surf: #FDFCF8; }
body { font-family: 'Inter', Arial, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }

header { display: flex; align-items: center; padding: 0 40px; height: 60px; border-bottom: 1px solid var(--line); background: var(--surf); }
.logo { font-size: 20px; font-weight: 700; letter-spacing: -.03em; text-decoration: none; color: var(--ink); }

.page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.card { width: 100%; max-width: 420px; background: var(--surf); border: 1px solid var(--line); border-radius: 12px; padding: 36px 32px 40px; }
.card-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
.card-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }

label { display: block; font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
input[type="email"] {
  display: block; width: 100%; padding: 11px 14px;
  font-family: inherit; font-size: 14px; color: var(--ink);
  background: #fff; border: 1.5px solid var(--line); border-radius: 8px;
  outline: none; transition: border-color .15s;
}
input[type="email"]:focus { border-color: var(--ink); }

.btn {
  display: block; width: 100%; margin-top: 18px; padding: 13px;
  background: var(--ink); color: #F5F3EA;
  border: none; border-radius: 30px; font-family: inherit;
  font-size: 14px; font-weight: 700; cursor: pointer; letter-spacing: -.01em;
}
.btn:disabled { background: #9CA3AF; cursor: not-allowed; }

.msg { margin-top: 14px; font-size: 13px; line-height: 1.5; min-height: 20px; }
.msg.error { color: #B91C1C; }
.msg.ok { color: #15803D; }

.divider { margin: 24px 0; border: none; border-top: 1px solid var(--line); }
.signup-link { font-size: 13px; color: var(--muted); text-align: center; }
.signup-link a { color: var(--ink); font-weight: 600; text-decoration: none; }
.signup-link a:hover { text-decoration: underline; }

footer { text-align: center; padding: 20px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>

<header>
  <a class="logo" href="/">Pliego.</a>
</header>

<div class="page">
  <div class="card">
    <div class="card-title">Sign in to Pliego</div>
    <div class="card-sub">Enter the email address associated with your Club Pliego account.</div>

    <form id="login-form">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" required>
      <button type="submit" class="btn" id="submit-btn">Continue</button>
    </form>
    <div class="msg" id="msg"></div>

    <hr class="divider">
    <div class="signup-link">
      Don't have an account? <a href="/join">Join Club Pliego</a>
    </div>
  </div>
</div>

<footer>Pliego Editions · <a href="/club-pliego-terms.pdf" style="color:inherit">Terms</a></footer>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');
  const email = document.getElementById('email').value.trim();
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  msg.className = 'msg';
  msg.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
      credentials: 'include',
    });
    if (r.ok) {
      msg.className = 'msg ok';
      msg.textContent = 'Signed in. Redirecting…';
      setTimeout(() => { window.location.href = '/cuenta'; }, 800);
    } else {
      const data = await r.json();
      msg.className = 'msg error';
      msg.textContent = r.status === 404
        ? 'No account found for that email. Try joining first.'
        : (data.message || 'Something went wrong. Try again.');
      btn.disabled = false;
      btn.textContent = 'Continue';
    }
  } catch {
    msg.className = 'msg error';
    msg.textContent = 'Connection error. Check your connection and try again.';
    btn.disabled = false;
    btn.textContent = 'Continue';
  }
});
</script>
</body>
</html>
